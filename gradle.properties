pluginGroup=ch.actemium.rider.servicefabric
pluginVersion=0.1.15

# Local Rider installation used as the IntelliJ Platform target.
# Defaults to %LOCALAPPDATA%/Programs/Rider; override with -PriderPath=...
# If the path does not exist, Rider below is downloaded.
riderVersion=2026.3

# Custom plugin repository: GitHub Releases. {version} is replaced by pluginVersion.
# Rider repository URL to add once: https://github.com/LoloActemium/rider-servicefabric/releases/latest/download/updatePlugins.xml
pluginRepositoryUrl=https://github.com/LoloActemium/rider-servicefabric/releases/download/v{version}
# pluginRepositoryDir=\\\\server\\share\\rider-plugins

kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
# The daemon's file-system watching keeps a stale snapshot of this file after `bumpVersion` rewrites it,
# so the next build in the same daemon would still package the previous pluginVersion.
org.gradle.vfs.watch=false
